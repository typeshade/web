name: Set up production environments

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-setup
  cancel-in-progress: false

jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test setup behavior before granting the admin credential
        run: node --test .github/scripts/setup-production.test.mjs
      - name: Configure production environments and keep operations off
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_ADMIN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RECORDS_READ_TOKEN: ${{ secrets.RECORDS_READ_TOKEN }}
        run: node .github/scripts/setup-production.mjs
