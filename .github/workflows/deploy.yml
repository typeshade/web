name: Deploy selected website
on:
  workflow_dispatch:
    inputs:
      site:
        description: Website to deploy
        type: choice
        required: true
        options: [typeshade, typenn, typecv]
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.site }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.site }}-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize source
        env:
          SITE: ${{ inputs.site }}
        run: |
          if [ "$SITE" = typeshade ]; then
            git submodule update --init apps/typeshade/vendor/shader-dsl
          else
            git submodule update --init "sources/$SITE"
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - if: inputs.site != 'typeshade'
        run: pnpm prepare:source ${{ inputs.site }}
      - run: pnpm check:${{ inputs.site }}
      - run: pnpm build:${{ inputs.site }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui apps/${{ inputs.site }}/dist
      - name: Deploy existing Worker and domain
        working-directory: apps/${{ inputs.site }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
