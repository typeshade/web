name: publish-examples

on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: Compiler commit or branch to publish
        type: string
        default: main
      force:
        description: Upload even when the release is already current
        type: boolean
        default: false
  repository_dispatch:
    types: [compiler-updated]

permissions:
  contents: read

concurrency:
  group: deploy-typeshade
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.WEBSITE_OPERATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: typeshade-production
    steps:
      - name: Check for the Cloudflare credential
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; nothing is published."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          submodules: true
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        if: steps.secrets.outputs.ok == 'true'
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
        if: steps.secrets.outputs.ok == 'true'
      - name: Read examples at the selected compiler commit
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/typeshade
        env:
          REF: ${{ inputs.compiler_ref || 'main' }}
        run: |
          if [[ "$REF" == -* ]]; then
            echo "::error::compiler_ref must be a branch or commit, not an option."
            exit 1
          fi
          if [[ ! "$REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            if ! git check-ref-format --branch "$REF"; then
              echo "::error::compiler_ref is not a valid branch name or full commit SHA."
              exit 1
            fi
          fi
          git -C vendor/shader-dsl fetch --quiet origin "$REF"
          git -C vendor/shader-dsl checkout --quiet FETCH_HEAD
          bun scripts/publish-examples.ts read
      - name: Apply TypeShade copy at the pinned compiler
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/typeshade
        run: |
          git submodule update --quiet vendor/shader-dsl
          bun scripts/publish-examples.ts words
      - name: Upload the release
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/typeshade
        env:
          FORCE: ${{ inputs.force }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$FORCE" = "true" ]; then
            bun scripts/publish-examples.ts upload --force
          else
            bun scripts/publish-examples.ts upload
          fi
