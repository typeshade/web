name: Website checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ui
      - run: pnpm build:ui
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:controls
        env:
          UI_SCREENSHOTS: artifacts/ui
      - run: pnpm test:patterns
        env:
          UI_SCREENSHOTS: artifacts/ui
      - uses: actions/upload-artifact@v4
        with:
          name: ui-workbench
          path: |
            apps/ui/dist
            artifacts/ui
          retention-days: 7
  scope:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.scope.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/affected.test.mjs
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "sites=$(node scripts/affected.mjs)" >> "$GITHUB_OUTPUT"
          else
            echo "sites=$(node scripts/affected.mjs "$BASE" HEAD)" >> "$GITHUB_OUTPUT"
          fi
  site:
    needs: scope
    if: needs.scope.outputs.sites != '[]'
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.scope.outputs.sites) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize the selected source
        env:
          SITE: ${{ matrix.site }}
        run: |
          if [ "$SITE" = typeshade ]; then
            git submodule update --init apps/typeshade/vendor/shader-dsl
          else
            git submodule update --init "sources/$SITE"
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
      - if: matrix.site != 'typeshade'
        run: pnpm prepare:source ${{ matrix.site }}
      - run: pnpm check:${{ matrix.site }}
      - run: pnpm build:${{ matrix.site }}
      - if: matrix.site == 'typecv'
        run: pnpm --filter typecv-site test:links
      - if: matrix.site == 'typenn'
        run: pnpm --filter typenn-site test:datasets && pnpm --filter typenn-site test:graph
      - if: matrix.site == 'typeshade'
        working-directory: apps/typeshade
        run: |
          bun scripts/check-reference-notes.ts --dist
          bun run check:benchmark-catalog
          bun run check:regression-catalog
          bun test scripts/playground-diagnostics.test.ts scripts/playground-host-default.test.ts scripts/compiler-authoring.test.ts scripts/compute-runtime.test.ts scripts/render-runtime.test.ts scripts/benchmarks.test.ts scripts/reference-notes.test.ts
          bun run qa:seo
          bun run qa:worker-routes
          bun run qa:openseo
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui apps/${{ matrix.site }}/dist
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.site }}
          path: apps/${{ matrix.site }}/dist
          retention-days: 7
