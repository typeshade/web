name: Website checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: node --test .github/scripts/*.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:styles
      - run: pnpm test:code
      - run: node --test scripts/deploy-preview-config.test.mjs scripts/deploy-worker-report.test.mjs
      - run: pnpm check:ui
      - run: pnpm build:ui
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:controls
        env:
          UI_SCREENSHOTS: artifacts/ui
      - run: pnpm test:patterns
        env:
          UI_SCREENSHOTS: artifacts/ui
      - uses: actions/upload-artifact@v4
        with:
          name: ui-workbench
          path: |
            apps/ui/dist
            artifacts/ui
          retention-days: 7
  scope:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.scope.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/affected.test.mjs
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "sites=$(node scripts/affected.mjs)" >> "$GITHUB_OUTPUT"
          else
            echo "sites=$(node scripts/affected.mjs "$BASE" HEAD)" >> "$GITHUB_OUTPUT"
          fi
  site:
    needs: scope
    if: needs.scope.outputs.sites != '[]'
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.scope.outputs.sites) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize the selected source
        env:
          SITE: ${{ matrix.site }}
        run: |
          if [ "$SITE" = typeshade ]; then
            git submodule update --init apps/typeshade/vendor/shader-dsl
          else
            git submodule update --init "sources/$SITE"
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
      - if: matrix.site != 'typeshade'
        run: pnpm prepare:source ${{ matrix.site }}
      - run: pnpm check:${{ matrix.site }}
      - if: matrix.site == 'typeshade'
        run: pnpm --filter typeshade-site test:playground-boundaries
      - run: pnpm build:${{ matrix.site }}
      - run: pnpm test:styles apps/${{ matrix.site }}/dist
      - if: matrix.site == 'typecv'
        run: pnpm --filter typecv-site test:links
      - if: matrix.site == 'typenn'
        run: pnpm --filter typenn-site test:datasets && pnpm --filter typenn-site test:graph && pnpm --filter typenn-site test:keras
      - if: matrix.site == 'typeshade'
        working-directory: apps/typeshade
        run: |
          bun scripts/check-reference-notes.ts --dist
          bun run check:benchmark-catalog
          bun run check:regression-catalog
          bun test scripts/playground-diagnostics.test.ts scripts/playground-host-default.test.ts scripts/compiler-authoring.test.ts scripts/compute-runtime.test.ts scripts/render-runtime.test.ts scripts/benchmarks.test.ts scripts/reference-notes.test.ts scripts/editorial-source.test.ts
          bun run qa:seo
          bun run qa:worker-routes
          bun run qa:openseo
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui apps/${{ matrix.site }}/dist
      - if: matrix.site == 'typeshade'
        name: Install the TypeShade test browser
        run: pnpm --filter typeshade-site exec playwright install --with-deps chromium
      - if: matrix.site == 'typeshade'
        run: pnpm --filter typeshade-site check:null-values
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.site }}
          path: apps/${{ matrix.site }}/dist
          retention-days: 7

  typecv-website:
    name: TypeCV website tests (${{ matrix.shard }}/4)
    needs: [scope, site]
    if: contains(fromJSON(needs.scope.outputs.sites), 'typecv')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init sources/typecv
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:source typecv
      - uses: actions/download-artifact@v4
        with:
          name: site-typecv
          path: apps/typecv/dist
      - run: pnpm exec playwright install --with-deps chromium
      # Some migrated helpers use the pinned library's Playwright; app tests resolve their
      # own locked version. Install both browser revisions instead of relying on a warm cache.
      - run: pnpm --filter typecv-site exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run migrated website tests
        working-directory: apps/typecv
        env:
          SHARD: ${{ matrix.shard }}
          CI: 'true'
        run: node --test --test-concurrency=1 --test-shard="$SHARD/4" *.test.mjs *.test.ts

  typecv-record-analysis:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.sites), 'typecv')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/typecv/scripts/requirements-record-analysis.txt
      - run: python -m pip install -r apps/typecv/scripts/requirements-record-analysis.txt
      - name: Test migrated record analysis tools
        working-directory: apps/typecv/scripts
        run: python -m unittest discover -s record_analysis/tests -t .
