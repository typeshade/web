name: gallery-setup

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [stills, access, both]
        default: stills
      reviewer_email:
        description: Address allowed into the gallery review page (access only)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-typeshade
  cancel-in-progress: false

jobs:
  stills:
    if: github.ref == 'refs/heads/main' && vars.WEBSITE_OPERATIONS_ENABLED == 'true' && inputs.task != 'access'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: typeshade-production
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build TypeShade from its pinned compiler
        run: pnpm build:typeshade
      - name: Capture and upload missing gallery stills
        working-directory: apps/typeshade
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/gallery-stills.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-stills
          path: apps/typeshade/gallery-stills
          if-no-files-found: ignore
          retention-days: 7

  access:
    if: github.ref == 'refs/heads/main' && vars.WEBSITE_OPERATIONS_ENABLED == 'true' && inputs.task != 'stills'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: typeshade-production
    steps:
      - name: Validate and mask the reviewer's address
        run: |
          email=$(jq -r '.inputs.reviewer_email // ""' "$GITHUB_EVENT_PATH")
          if [ -z "$email" ]; then
            echo "::error::reviewer_email is required for the access task."
            exit 1
          fi
          echo "::add-mask::$email"
          echo "GALLERY_REVIEWER_EMAIL=$email" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
      - name: Configure gallery review access
        working-directory: apps/typeshade
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/setup-gallery-access.ts
