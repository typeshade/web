name: Export TypeCV lab run records

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Newest records to export (1–100)
        type: string
        default: '50'
      print:
        description: Records to print in full (failures, all, none)
        type: choice
        options: [failures, all, none]
        default: failures
      record:
        description: Record ids to export instead of the newest, comma-separated
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-typecv
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/main' && vars.WEBSITE_OPERATIONS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: typecv-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Export the records
        working-directory: apps/typecv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIMIT: ${{ inputs.limit || '50' }}
          PRINT_MODE: ${{ inputs.print || 'failures' }}
          RECORD: ${{ inputs.record }}
        run: |
          if [[ ! "$LIMIT" =~ ^[0-9]{1,3}$ ]] || (( LIMIT < 1 || LIMIT > 100 )); then
            echo "::error::limit must be an integer from 1 to 100."
            exit 1
          fi
          case "$PRINT_MODE" in
            failures|all|none) ;;
            *) echo "::error::print must be failures, all, or none."; exit 1 ;;
          esac
          node scripts/export-run-records.mjs --out lab-records \
            --limit "$LIMIT" --print "$PRINT_MODE" --record "$RECORD"
      - name: Compare hardware-check records
        working-directory: apps/typecv
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in lab-records/*.json; do
            [ "$(basename "$file")" = index.json ] && continue
            node -e "process.exit(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).format === 'typecv-hardware-check-v1' ? 0 : 1)" "$file" || continue
            echo "### Hardware check $(basename "$file" .json)" >> "$GITHUB_STEP_SUMMARY"
            status=0
            node scripts/compare-hardware-check.mjs --record "$file" | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
            echo "compare-hardware-check.mjs exited $status for $file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lab-records
          path: apps/typecv/lab-records
          retention-days: 14
