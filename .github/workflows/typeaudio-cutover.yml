name: TypeAudio production cutover
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-setup
  cancel-in-progress: false
jobs:
  setup:
    if: github.ref == 'refs/heads/main' && vars.WEBSITE_OPERATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test .github/scripts/typeaudio-cutover.test.mjs
      - name: Configure only TypeAudio and disable its legacy publisher
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_ADMIN_TOKEN }}
        run: node .github/scripts/typeaudio-cutover.mjs setup
